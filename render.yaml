# Render Blueprint para Orquestra de Potenciais

services:
  # Backend Web Service
  - type: web
    name: orquestra-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: orquestra-database
          property: connectionString

databases:
  # PostgreSQL Database
  - name: orquestra-database
    databaseName: orquestra_potenciais
    plan: free
    region: oregon
